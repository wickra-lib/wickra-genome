[package]
name = "genome-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Market-genome vector engine: every asset as a 514-dim live vector over the streaming indicators, with similarity, clustering and anomaly detection."

[package.metadata.docs.rs]
# Document every feature so an optional surface is not missing from the
# reference. docs.rs builds on nightly and sets the `docsrs` cfg, which is what
# makes the feature badges appear.
all-features = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
wickra-core = { workspace = true }
wickra-data = { workspace = true }
wickra-backtest-core = { workspace = true }
rayon = { workspace = true, optional = true }
wickra-exchange = { workspace = true, optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
live = ["dep:wickra-exchange"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

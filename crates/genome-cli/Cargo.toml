[package]
name = "wickra-genome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reference CLI for the Wickra Genome vector engine."

[[bin]]
name = "wickra-genome"
path = "src/main.rs"

[package.metadata.docs.rs]
# Document every feature so an optional surface is not missing from the
# reference. docs.rs builds on nightly and sets the `docsrs` cfg, which is what
# makes the feature badges appear.
all-features = true

[dependencies]
wickra-genome-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

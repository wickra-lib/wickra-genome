[workspace]
resolver = "2"
# cargo-fuzz builds this crate on its own, with sanitizer flags the workspace
# must not inherit, so it is not a member.
exclude = ["fuzz"]
members = [
    "crates/genome-core",
    "crates/genome-cli",
    "crates/genome-bench",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
    "bindings/c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-genome"
authors = ["wickra-lib"]

[workspace.dependencies]
# Workspace-internal core, referenced by the CLI, bench and bindings.
wickra-genome-core = { version = "0.1.0", path = "crates/genome-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rust_decimal = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
# The O(1) streaming indicators that build every asset's feature vector, and the
# Candle type / CSV reader.
#
# Held at the same major as the copy `wickra-backtest-core` resolves, so the tree
# carries one `wickra-core` and one set of indicator types rather than two that
# share none at all.
wickra-core = "1.0"
wickra-data = "1.0"
# The name -> indicator resolver (the only such factory in the ecosystem); it
# pulls in wickra-core transitively and provides the serde `Candle`, and
# `registry::feed_of` reports which side feed each indicator consumes.
wickra-backtest-core = "0.1.4"
# A live market feed for the cross-section query; used behind the `live` feature.
wickra-exchange = "0.1.3"
cbindgen = "0.27"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (same precedent as the wickra core).
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
